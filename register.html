<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Hidden_Rack Pakistan</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-box {
      max-width: 540px;
      margin: 40px auto;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-light);
      padding: 40px;
    }
  </style>
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <span>Premium Thrifted Sneakers • Authentic Finds • Delivery Across Pakistan</span>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        HIDDEN_RACK<span class="accent-dot"></span>
      </a>
      <a href="index.html" class="btn-secondary" style="padding:8px 16px; font-size:11px;">BACK TO STORE</a>
    </div>
  </header>

  <!-- Register Form Section -->
  <section class="section-padding" style="background-color: var(--bg-secondary);">
    <div class="container">

      <div class="auth-box">
        <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 8px;">CREATE AN ACCOUNT</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">Join Hidden_Rack to unlock priority access to rare thrift sneaker drops in Pakistan.</p>

        <form id="register-form" onsubmit="handleCustomerRegister(event)">
          <div class="form-group">
            <label>FULL NAME *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ayesha Raza" required />
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>EMAIL ADDRESS *</label>
              <input type="email" id="reg-email" class="form-control" placeholder="ayesha@example.com" required />
            </div>
            <div class="form-group">
              <label>PHONE NUMBER *</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="0300-9876543" required />
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>PASSWORD *</label>
              <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6" />
            </div>
            <div class="form-group">
              <label>CONFIRM PASSWORD *</label>
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required minlength="6" />
            </div>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 12px; cursor: pointer;">
              <input type="checkbox" required accent-color="var(--text-main)" style="margin-top:2px;" />
              <span>I agree to Hidden_Rack's <a href="about.html" style="text-decoration:underline;">Terms & Conditions</a> and thrift grading policies.</span>
            </label>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; margin-bottom: 20px;">CREATE ACCOUNT</button>
        </form>

        <div style="text-align: center; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--border-light); padding-top: 20px;">
          Already have an account? <a href="login.html" style="font-weight: 700; color: var(--text-main); text-decoration: underline;">Login Here</a>
        </div>
      </div>

    </div>
  </section>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

  <script>
    async function handleCustomerRegister(e) {
      e.preventDefault();
      const pass = document.getElementById("reg-password").value;
      const confirmPass = document.getElementById("reg-confirm-password").value;

      if (pass !== confirmPass) {
        window.showToast("Passwords do not match!", "error");
        return;
      }

      const userData = {
        name: document.getElementById("reg-name").value,
        email: document.getElementById("reg-email").value,
        phone: document.getElementById("reg-phone").value,
        password: pass
      };

      const result = await window.AuthStore.registerCustomer(userData);
      if (result.success) {
        window.showToast("Account created successfully! Welcome to Hidden_Rack.", "success");
        setTimeout(() => window.location.href = "account.html", 800);
      } else {
        window.showToast(result.message, "error");
      }
    }
  </script>
</body>
</html>
