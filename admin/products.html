<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | Admin Hidden_Rack</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="../index.html" class="admin-sidebar-brand">
          HIDDEN_RACK <span class="admin-badge">ADMIN</span>
        </a>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item">Dashboard</a>
        <a href="products.html" class="admin-nav-item active">Products</a>
        <a href="add-product.html" class="admin-nav-item">Add Product</a>
        <a href="categories.html" class="admin-nav-item">Categories</a>
        <a href="orders.html" class="admin-nav-item">Orders</a>
        <a href="customers.html" class="admin-nav-item">Customers</a>
        <a href="reviews.html" class="admin-nav-item">Reviews</a>
        <a href="inventory.html" class="admin-nav-item">Inventory</a>
        <a href="settings.html" class="admin-nav-item">Settings</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="admin-page-title">PRODUCT MANAGEMENT</h1>
        <a href="add-product.html" class="btn-primary" style="padding:10px 20px; font-size:12px;">+ ADD NEW PRODUCT</a>
      </div>

      <div class="admin-content">

        <div class="admin-card">
          <div class="admin-card-header">
            <h3>THRIFT FOOTWEAR CATALOG</h3>
            <input type="text" id="admin-product-search" placeholder="Search by name, SKU..." oninput="filterAdminProducts()" style="padding:8px 14px; border:1px solid var(--border-light); font-size:13px; width:280px;" />
          </div>

          <table class="admin-table">
            <thead>
              <tr>
                <th>IMAGE</th>
                <th>PRODUCT & SKU</th>
                <th>BRAND</th>
                <th>CATEGORY</th>
                <th>PRICE (PKR)</th>
                <th>STOCK</th>
                <th>CONDITION</th>
                <th>TAGS</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="admin-products-table-body">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
          <div id="admin-products-pagination" style="display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:16px;"></div>
        </div>

      </div>
    </main>

  </div>

  <!-- Edit Product Modal -->
  <div id="edit-product-modal" class="search-modal-overlay">
    <div class="search-modal-card" style="max-width: 650px;">
      <div class="search-modal-header">
        <h3>EDIT THRIFT PRODUCT</h3>
        <button class="search-modal-close" onclick="document.getElementById('edit-product-modal').classList.remove('active')">&times;</button>
      </div>
      <div class="search-modal-body" style="padding: 20px 24px;">
        <form onsubmit="AdminManager.handleSaveProductEdit(event)">
          <input type="hidden" id="edit-p-id" />
          
          <div class="form-grid-2">
            <div class="form-group">
              <label>PRODUCT NAME *</label>
              <input type="text" id="edit-p-name" class="form-control" required />
            </div>
            <div class="form-group">
              <label>BRAND *</label>
              <input type="text" id="edit-p-brand" class="form-control" required />
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>CATEGORY *</label>
              <select id="edit-p-category" class="form-control" required>
                <option value="Sneakers">Sneakers</option>
                <option value="Running Shoes">Running Shoes</option>
                <option value="Casual Shoes">Casual Shoes</option>
                <option value="Boots">Boots</option>
                <option value="Men">Men</option>
                <option value="Women">Women</option>
              </select>
            </div>
            <div class="form-group">
              <label>PRICE (PKR) *</label>
              <input type="number" id="edit-p-price" class="form-control" required />
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>ORIGINAL RETAIL PRICE (PKR)</label>
              <input type="number" id="edit-p-original-price" class="form-control" />
            </div>
            <div class="form-group">
              <label>STOCK QUANTITY *</label>
              <input type="number" id="edit-p-stock" class="form-control" required />
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>CONDITION GRADE *</label>
              <input type="text" id="edit-p-condition" class="form-control" placeholder="9/10 - Near Mint" required />
            </div>
            <div class="form-group">
              <label>CONDITION RATING (SCORE) *</label>
              <input type="number" step="0.1" id="edit-p-rating" class="form-control" required />
            </div>
          </div>

          <div class="form-group">
            <label>AVAILABLE SIZES (Comma Separated) *</label>
            <input type="text" id="edit-p-sizes" class="form-control" placeholder="EU 41, EU 42, EU 43" required />
          </div>

          <div class="form-group">
            <label>UPLOAD PRODUCT IMAGE FILE OR ENTER URL *</label>
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:8px;">
              <input type="file" accept="image/*" class="form-control" style="flex:1;" onchange="handleImageFileSelect(this, 'edit-p-image')" />
              <span style="font-size:12px; font-weight:bold; color:var(--text-muted);">OR</span>
            </div>
            <input type="text" id="edit-p-image" class="form-control" required placeholder="Image URL or Base64..." />
          </div>

          <div class="form-group">
            <label>DESCRIPTION</label>
            <textarea id="edit-p-description" class="form-control" rows="3"></textarea>
          </div>

          <div style="display:flex; gap:20px; margin-bottom:20px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:700;">
              <input type="checkbox" id="edit-p-featured" /> FEATURED PRODUCT
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:700;">
              <input type="checkbox" id="edit-p-new-arrival" /> NEW ARRIVAL
            </label>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:12px;">
            <button type="button" class="btn-secondary" onclick="document.getElementById('edit-product-modal').classList.remove('active')">CANCEL</button>
            <button type="submit" class="btn-primary">SAVE CHANGES</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.AdminManager.loadProductsTable();
    });

    function handleImageFileSelect(fileInput, targetInputId) {
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(targetInputId).value = e.target.result;
          window.showToast?.("Local image file converted & loaded!", "success");
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    }

    function filterAdminProducts() {
      const q = document.getElementById("admin-product-search").value.toLowerCase();
      const rows = document.querySelectorAll("#admin-products-table-body tr");
      rows.forEach(r => {
        const text = r.textContent.toLowerCase();
        r.style.display = text.includes(q) ? "" : "none";
      });
    }
  </script>
</body>
</html>
